name: iOS — List certificates

# Diagnostic helper: shows which distribution certificates exist on the Apple
# account, so a "maximum number of certificates" failure can be resolved with
# facts instead of guesses.
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: List certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane list_certs
