name: iOS — Account diagnostics

# Diagnostic helper: shows which distribution certificates exist on the Apple
# account, so a "maximum number of certificates" failure can be resolved with
# facts instead of guesses.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Which diagnostic lane to run"
        required: true
        default: testflight_status
        type: choice
        options: [testflight_status, list_certs, add_internal_tester, delete_profiles]
      who:
        description: "For add_internal_tester: name or email of the account user"
        required: false
        type: string
      ids:
        description: "For delete_profiles: comma-separated bundle IDs"
        required: false
        type: string

jobs:
  list:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run lane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "${{ inputs.who }}" ]; then
            bundle exec fastlane ${{ inputs.lane }} who:"${{ inputs.who }}"
          elif [ -n "${{ inputs.ids }}" ]; then
            bundle exec fastlane ${{ inputs.lane }} ids:"${{ inputs.ids }}"
          else
            bundle exec fastlane ${{ inputs.lane }}
          fi
