name: Android — Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Write .env
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          if [ -z "$AGORA_APP_ID" ]; then
            echo "::error::Secret AGORA_APP_ID is not set"; exit 1
          fi
          echo "AGORA_APP_ID=$AGORA_APP_ID" > .env

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/soarxvoice-release.keystore

      - name: Build App Bundle and APK
        env:
          ANDROID_KEYSTORE_FILE: app/soarxvoice-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: soarxvoice-android-release
          retention-days: 30
          # A path that silently matches nothing is how the APKs went missing once.
          if-no-files-found: error
          # ABI splits mean there is no single app-release.apk: the build
          # produces app-<abi>-release.apk plus app-universal-release.apk.
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      - name: Clean up secrets
        if: always()
        run: rm -f android/app/soarxvoice-release.keystore .env
